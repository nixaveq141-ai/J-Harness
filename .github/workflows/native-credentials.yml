name: Native credential stores
on:
  push:
    branches: [codex/m1054-native-validation]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native-credentials:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build packaged Web UI
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
      - name: Compile and package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\mvnw.cmd -B -pl harness-cli -am -DskipTests package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile and package POSIX
        if: runner.os != 'Windows'
        run: sh ./mvnw -B -pl harness-cli -am -DskipTests package
      - name: Install Linux Secret Service
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus-x11 libsecret-1-0 gnome-keyring
      - name: Prepare isolated macOS test keychain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci-keychain.py setup
      - name: Verify Linux native persistence
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/jharness-keyring-home"
          mkdir -p "$HOME"
          env -u DBUS_SESSION_BUS_ADDRESS -u XDG_RUNTIME_DIR -u DISPLAY python scripts/test-native-credentials.py --case missing-service
          dbus-run-session -- bash -eu -c '
            python -c "import secrets; print(secrets.token_hex(32))" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            python scripts/ci-secret-service.py ready
            python scripts/test-native-credentials.py
            dbus-send --session --print-reply --dest=org.freedesktop.secrets /org/freedesktop/secrets org.freedesktop.Secret.Service.Lock array:objpath:/org/freedesktop/secrets/collection/login >/dev/null
            python scripts/ci-secret-service.py locked
            python scripts/test-native-credentials.py --case locked-service
          '
      - name: Verify Windows and macOS native persistence
        if: runner.os != 'Linux'
        run: python scripts/test-native-credentials.py
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-credentials-${{ matrix.os }}
          path: .build-cache/M10.5.4-native-*.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Delete isolated macOS test keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          python scripts/ci-keychain.py cleanup

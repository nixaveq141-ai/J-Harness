name: P1 pinned Windows x86 WinPTY source and owned agent
on:
  workflow_dispatch:
  push:
    branches: [codex/m1059-full-validation]
    paths: [.github/workflows/gap-p1-windows-x86-pty.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      JHARNESS_WINDOWS_PTY_ARCH: x86
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual x86 native compiler
        shell: pwsh
        run: |
          & 'C:\msys64\usr\bin\bash.exe' -lc 'pacman -S --noconfirm --needed make mingw-w64-i686-gcc'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'C:\msys64\mingw32\bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          'C:\msys64\usr\bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - run: python docs/testing/tools/test-build-windows-pty-from-source.py
      - run: python docs/testing/tools/test-patch-winpty-directory.py
      - run: python docs/testing/tools/build-windows-pty-from-source.py --component winpty
      - run: python scripts/probe-p1-windows-x86-pty.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-windows-x86-winpty-source
          include-hidden-files: true
          retention-days: 90
          path: |
            .build-cache/windows-pty-source/report.json
            .build-cache/windows-pty-source/*.log
            .build-cache/windows-pty-source/winpty/build/winpty.dll
            .build-cache/windows-pty-source/winpty/build/winpty-agent.exe
            .build-cache/p1-win32-pty-probe/

name: P1 OpenBSD 7.9 x64 JNA source components
on:
  workflow_dispatch:
  push:
    branches: [codex/m1059-full-validation]
    paths: [.github/workflows/gap-p1-openbsd-jna.yml]
permissions:
  contents: read
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        target: [x86-64]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test-p1-openbsd-jna.py
      - uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3
        with:
          release: '7.9'
          arch: x86_64
          mem: 4096
          cpu: 2
          disable-cache: true
          envs: GITHUB_ACTIONS GITHUB_RUN_ID GITHUB_SHA
          prepare: |
            set -eux
            pkg_info -Q python | tee /tmp/p1-python-packages.log
            python_package=$(awk '{print $1}' /tmp/p1-python-packages.log | grep -E '^python-3\.1[1-9]\.[0-9]+(p[0-9]+)?$' | tail -n 1)
            test -n "$python_package"
            pkg_add -I "$python_package" git gmake binutils jdk%21 apache-ant
          run: |
            git config --global --add safe.directory "$PWD"
            export JAVA_HOME=/usr/local/jdk-21
            export PATH="$JAVA_HOME/bin:$PATH"
            python_package=$(pkg_info -q | awk '{print $1}' | grep -E '^python-3\.1[1-9]\.' | tail -n 1)
            python_bin=$(pkg_info -L "$python_package" | awk '/^\/usr\/local\/bin\/python3\.[0-9]+$/ {print; exit}')
            test -x "$python_bin"
            "$python_bin" -c 'import sys; assert sys.version_info >= (3, 11)'
            "$python_bin" scripts/build-p1-openbsd-jna.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-openbsd-${{ matrix.target }}-jna-source
          include-hidden-files: true
          retention-days: 90
          path: |
            .build-cache/p1-openbsd-jna/${{ matrix.target }}/report.json
            .build-cache/p1-openbsd-jna/${{ matrix.target }}/*.log
            .build-cache/p1-openbsd-jna/${{ matrix.target }}/*-command.json
            .build-cache/p1-openbsd-jna/${{ matrix.target }}/libjnidispatch.so
            .build-cache/p1-openbsd-jna/${{ matrix.target }}/original.so
            .build-cache/p1-openbsd-jna/${{ matrix.target }}/jni-probe
            .build-cache/p1-openbsd-jna/${{ matrix.target }}/callback-control
            .build-cache/p1-openbsd-jna/${{ matrix.target }}/libffi-release-3.4.4.tar.gz

name: M10.5.9 full workbench validation
on:
  push:
    branches-ignore: [codex/m1054-native-validation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      JHARNESS_EVIDENCE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and verify browser client
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          mkdir -p ../.build-cache/M10.5.9
          python ../scripts/evidence_run.py --name client --cwd . --log ../.build-cache/M10.5.9/client.log -- npm test
          python ../scripts/evidence_run.py --name sdk-typecheck --cwd . --log ../.build-cache/M10.5.9/sdk-typecheck.log -- node node_modules/typescript/bin/tsc --ignoreConfig --noEmit --strict --target es2022 --module nodenext --moduleResolution nodenext --allowImportingTsExtensions --types node --typeRoots node_modules/@types ../sdk/typescript/src/index.ts ../sdk/examples/run.ts
          npm audit --audit-level=low
          npm run build
      - name: Verify on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/evidence_run.py --name verify --log verify.log --output harness-cli/target/harness-cli-0.1.0-SNAPSHOT.jar -- mvnw.cmd -B -Prelease-audit clean verify org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom
          if ($LASTEXITCODE -ne 0) { Get-Content verify.log -Tail 100; exit $LASTEXITCODE }
      - name: Verify on POSIX
        if: runner.os != 'Windows'
        run: |
          python scripts/evidence_run.py --name verify --log verify.log --output harness-cli/target/harness-cli-0.1.0-SNAPSHOT.jar -- sh ./mvnw -B -Prelease-audit clean verify org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom
      - name: Install browsers and credential service on Linux
        if: runner.os == 'Linux'
        working-directory: frontend
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-x11 libsecret-1-0 gnome-keyring
          npx playwright install --with-deps chromium firefox webkit
      - name: Install browsers on Windows and macOS
        if: runner.os != 'Linux'
        working-directory: frontend
        run: npx playwright install chromium firefox webkit
      - name: Prepare isolated macOS test keychain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/jharness-m1059.keychain-db"
          password="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security default-keychain -d user -s "$keychain"
          security list-keychains -d user -s "$keychain"
      - name: Verify full SDK and three-browser matrix on Windows and macOS
        if: runner.os != 'Linux'
        run: python scripts/run-m1059-platform.py
      - name: Verify Linux credential availability and full matrix
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          env -u DBUS_SESSION_BUS_ADDRESS -u XDG_RUNTIME_DIR -u DISPLAY python scripts/test-native-credentials.py --case missing-service
          dbus-run-session -- bash -eu -c '
            python -c "import secrets; print(secrets.token_hex(32))" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            python scripts/run-m1059-platform.py
            dbus-send --session --print-reply --dest=org.freedesktop.secrets /org/freedesktop/secrets org.freedesktop.Secret.Service.Lock array:objpath:/org/freedesktop/secrets/collection/login >/dev/null
            python scripts/test-native-credentials.py --case locked-service
          '
      - name: Validate release gates and install candidate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test-release-tools.py
          python scripts/test-sdk-inventory.py
          python scripts/test-evidence-run.py
          python scripts/test-evidence-io.py
          python scripts/test-history-evidence.py
          python scripts/test-smoke-evidence.py
          node scripts/test-workbench-evidence.mjs
          python scripts/test-m1059-gates.py
          python scripts/test-source-secrets.py
          python scripts/scan-source-secrets.py
          python scripts/sdk-inventory.py
          python scripts/frontend-sbom.py target/frontend-bom.json
          npm --prefix frontend audit --json > target/frontend-audit.json
          python scripts/collect-release-evidence.py verify.log M10.5.9
          python scripts/prepare-legal.py
          git diff --exit-code -- third-party
          python scripts/scan-osv.py target/bom.json target/osv-results.json
          python scripts/build-candidate.py
          python scripts/evidence_run.py --name smoke --log .build-cache/M10.5.9/smoke.log --output target/candidate-smoke.json -- python scripts/smoke-candidate.py
          python scripts/collect-m1059-evidence.py verify.log
      - name: Delete isolated macOS test keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/jharness-m1059.keychain-db"
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          include-hidden-files: true
          path: |
            **/target/surefire-reports/
            verify.log
            target/bom.json
            target/frontend-bom.json
            target/frontend-audit.json
            target/sdk-bom.json
            target/sdk-source-inventory.json
            target/source-secrets.json
            target/osv-results.json
            target/release-evidence.json
            target/candidate-smoke.json
            target/*candidate.zip
            target/candidate-sha256.txt
            .build-cache/M10.5.9/
            .build-cache/M10.5.4-native-*.json
            .build-cache/M10-browser-results.json
            .build-cache/M10-launcher-results.json
            .build-cache/M10-settings-browser-results.json
            .build-cache/M10-browser-*.json
            .build-cache/M10-*.png

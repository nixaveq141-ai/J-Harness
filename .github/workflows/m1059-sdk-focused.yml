name: M10.5.9 Windows SDK diagnosis (not acceptance)
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  sdk:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare current packaged client
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force .build-cache/M10.5.9 | Out-Null
          npm.cmd --prefix frontend ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd --prefix frontend run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\mvnw.cmd -B package '-DskipTests' *> .build-cache/M10.5.9/sdk-focused-package.log
          if ($LASTEXITCODE -ne 0) { Get-Content .build-cache/M10.5.9/sdk-focused-package.log -Tail 60; exit 1 }
      - name: Diagnose only the original SDK checks
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $env:JHARNESS_PYTHON = python -c 'import sys; print(sys.executable)'
          node sdk/tests/run.mjs *> .build-cache/M10.5.9/sdk-focused.log
          $sdkExit = $LASTEXITCODE
          Get-Content .build-cache/M10.5.9/sdk-focused.log -Tail 25
          exit $sdkExit
      - name: Preserve fixed safe SDK diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1059-sdk-focused-windows
          include-hidden-files: true
          path: |
            .build-cache/M10.5.9/sdk-focused.log
            .build-cache/M10.5.8-sdk-results.json

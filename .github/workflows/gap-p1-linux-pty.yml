name: P1 pinned Linux extra-architecture PTY components
on:
  workflow_dispatch:
  push:
    branches: [codex/m1059-full-validation]
    paths: [.github/workflows/gap-p1-linux-pty.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86
            packages: gcc-i686-linux-gnu libc6-dev-i386-cross
          - target: arm
            packages: gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
          - target: mips64el
            packages: gcc-mips64el-linux-gnuabi64 libc6-dev-mips64el-cross
          - target: ppc64le
            packages: gcc-powerpc64le-linux-gnu libc6-dev-ppc64el-cross
          - target: riscv64
            packages: gcc-riscv64-linux-gnu libc6-dev-riscv64-cross
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test-p1-linux-pty.py
      - name: Install target compiler, libc headers and user emulator
        run: |
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 install -y --no-install-recommends make qemu-user ${{ matrix.packages }}
      - run: python scripts/build-p1-linux-pty.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-linux-pty-${{ matrix.target }}
          include-hidden-files: true
          path: |
            .build-cache/p1-linux-pty/${{ matrix.target }}/*.json
            .build-cache/p1-linux-pty/${{ matrix.target }}/*.log
            .build-cache/p1-linux-pty/${{ matrix.target }}/*.so
            .build-cache/p1-linux-pty/${{ matrix.target }}/pty-probe

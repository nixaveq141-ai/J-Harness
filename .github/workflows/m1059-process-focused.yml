name: M10.5.9 process ownership diagnostics (not acceptance)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ownership:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Prepare Windows lock-owner inspection
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'm1059-handle'
          New-Item -ItemType Directory -Force $directory | Out-Null
          Invoke-WebRequest 'https://download.sysinternals.com/files/Handle.zip' -OutFile (Join-Path $directory 'Handle.zip') -TimeoutSec 30
          Expand-Archive (Join-Path $directory 'Handle.zip') -DestinationPath $directory
          $executable = Join-Path $directory 'handle64.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $executable
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'Invalid Handle signature' }
          "JHARNESS_PROCESS_HANDLE_EXE=$executable" >> $env:GITHUB_ENV
      - name: Verify owned-process compensation on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .build-cache/M10.5.9 | Out-Null
          .\mvnw.cmd -B -pl harness-ecosystem -am test '-Dtest=R1RemainingOwnershipFaultTest,R1EnvironmentLifecycleTest,R3McpProtocolTest,M6TerminalTest,LocalProcessRunnerTest' '-Dsurefire.failIfNoSpecifiedTests=false' *> .build-cache/M10.5.9/process-focused.log
          if ($LASTEXITCODE -ne 0) { Get-Content .build-cache/M10.5.9/process-focused.log -Tail 100; exit 1 }
      - name: Verify owned-process compensation on POSIX
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p .build-cache/M10.5.9
          if ! bash ./mvnw -B -pl harness-ecosystem -am test '-Dtest=R1RemainingOwnershipFaultTest,R1EnvironmentLifecycleTest,R3McpProtocolTest,M6TerminalTest,LocalProcessRunnerTest' '-Dsurefire.failIfNoSpecifiedTests=false' > .build-cache/M10.5.9/process-focused.log 2>&1; then
            tail -n 100 .build-cache/M10.5.9/process-focused.log
            exit 1
          fi
      - name: Explain diagnostic scope
        if: always()
        shell: bash
        run: echo 'Only selected process ownership tests run here. This is not full M10.5.9 acceptance and cannot grant M11 eligibility.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve original process evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1059-process-focused-${{ matrix.os }}
          include-hidden-files: true
          path: |
            .build-cache/M10.5.9/process-focused.log
            harness-ecosystem/target/surefire-reports/
            harness-process/target/surefire-reports/

name: Unified source-native forty-eight-resource five-target qualification
# Browser fixtures wait for selected conversation synchronization before detail expansion.
on:
  workflow_dispatch:
  push:
    branches: [codex/m1059-full-validation]
    paths: [.github/workflows/gap-unified-source-qualification.yml]
permissions:
  contents: read
  actions: read
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
          - os: ubuntu-24.04
          - os: macos-latest
          - os: ubuntu-24.04-arm
          - os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      JHARNESS_EVIDENCE_RUN_ID: unified-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-${{ github.sha }}
      JHARNESS_MATRIX_KEEP_GOING: '1'
      JHARNESS_UNIFIED_SOURCE: '1'
      JHARNESS_P1_LINUX_PTY: '1'
      JHARNESS_P1_LINUX_JNA: '1'
      JHARNESS_P1_WINDOWS_X86_JNA: '1'
      JHARNESS_P1_WINDOWS_X86_PTY: '1'
      JHARNESS_P1_FREEBSD_PTY: '1'
      JHARNESS_P1_FREEBSD_JNA: '1'
      JHARNESS_P1_LOONGARCH_JNA: '1'
      JHARNESS_P1_EXTRA_FOUR: '1'
      JHARNESS_P1_OPENBSD_JNA: '1'
      JHARNESS_P1_ARM64_WINPTY: '1'
      JHARNESS_P1_ARM64_CONSOLE: '1'
      JHARNESS_P1_CYGLAUNCH: '1'
      JHARNESS_P1_SPARC_JNA: '1'
      JHARNESS_P1_OPENBSD_I386_JNA: '1'
      JHARNESS_EXPECTED_NATIVE_COUNT: '48'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build current application and check native staging guards
        run: |
          set -euo pipefail
          python scripts/test-unified-native-runtime.py
          python scripts/test-posix-native-runtime.py
          python scripts/test-source-native-qualification.py
          npm --prefix frontend ci
          npm --prefix frontend test > source-client.log 2>&1
          npm --prefix frontend run build
          sh ./mvnw -B -DskipTests package > source-qualification-build.log 2>&1
      - uses: actions/download-artifact@v4
        with:
          name: source-native-java-install-windows
          run-id: 41266807712
          github-token: ${{ github.token }}
          path: .build-cache/unified-inputs/windows
      - uses: actions/download-artifact@v4
        with:
          name: source-native-full-ubuntu-24.04
          run-id: 41268207915
          github-token: ${{ github.token }}
          path: .build-cache/unified-inputs/linux
      - uses: actions/download-artifact@v4
        with:
          name: source-native-full-macos-latest
          run-id: 41268207915
          github-token: ${{ github.token }}
          path: .build-cache/unified-inputs/macos
      - uses: actions/download-artifact@v4
        with:
          name: native-source-ubuntu-24.04-arm
          run-id: 41285899341
          github-token: ${{ github.token }}
          path: .build-cache/unified-extra-inputs/linux-arm64
      - uses: actions/download-artifact@v4
        with:
          name: native-source-macos-15-intel
          run-id: 41285899341
          github-token: ${{ github.token }}
          path: .build-cache/unified-extra-inputs/macos-intel
      # Use the same fixed accepted component bytes on every target.
      - uses: actions/download-artifact@v4
        with:
          pattern: p1-linux-pty-*
          run-id: 41823433458
          github-token: ${{ github.token }}
          path: .build-cache/p1-inputs
      - run: python scripts/test-p1-component-stage.py
      - uses: actions/download-artifact@v4
        with:
          pattern: p1-linux-jna-*
          run-id: 41830641417
          github-token: ${{ github.token }}
          path: .build-cache/p1-jna-inputs
      - run: python scripts/test-p1-jna-stage.py
      - uses: actions/download-artifact@v4
        with:
          name: p1-windows-x86-jna-source
          run-id: 41992679907
          github-token: ${{ github.token }}
          path: .build-cache/p1-win32-inputs
      - run: python scripts/test-p1-windows-x86-stage.py
      - uses: actions/download-artifact@v4
        with:
          name: p1-windows-x86-winpty-source
          run-id: 41998518872
          github-token: ${{ github.token }}
          path: .build-cache/p1-win32-pty-inputs
      - run: python scripts/test-p1-windows-x86-pty-stage.py
      - uses: actions/download-artifact@v4
        with:
          pattern: p1-freebsd-*-pty-source
          run-id: 42003119496
          github-token: ${{ github.token }}
          path: .build-cache/p1-freebsd-inputs
      - run: python scripts/test-p1-freebsd-stage.py
      - uses: actions/download-artifact@v4
        with:
          pattern: p1-freebsd-*-jna-source
          run-id: 42150888437
          github-token: ${{ github.token }}
          path: .build-cache/p1-freebsd-jna-inputs
      - run: python scripts/test-p1-freebsd-jna-stage.py
      - uses: actions/download-artifact@v4
        with:
          pattern: p1-linux-jna-loongarch64
          run-id: 42155835171
          github-token: ${{ github.token }}
          path: .build-cache/p1-loongarch-jna-inputs
      - run: python scripts/test-p1-loongarch-jna-stage.py
      - uses: actions/download-artifact@v4
        with:
          pattern: p1-sunos-*-jna-source
          run-id: 42158505948
          github-token: ${{ github.token }}
          path: .build-cache/p1-sunos-jna-inputs
      - uses: actions/download-artifact@v4
        with:
          pattern: p1-windows-arm64-jna-source
          run-id: 42159389661
          github-token: ${{ github.token }}
          path: .build-cache/p1-arm64-inputs
      - uses: actions/download-artifact@v4
        with:
          pattern: p1-windows-arm64-helper-source
          run-id: 42158936851
          github-token: ${{ github.token }}
          path: .build-cache/p1-arm64-inputs
      - uses: actions/download-artifact@v4
        with:
          name: p1-openbsd-x86-64-jna-source
          run-id: 42227334617
          github-token: ${{ github.token }}
          path: .build-cache/p1-openbsd-jna-inputs/p1-openbsd-x86-64-jna-source
      - uses: actions/download-artifact@v4
        with:
          name: p1-windows-arm64-winpty-source
          run-id: 42228145670
          github-token: ${{ github.token }}
          path: .build-cache/p1-arm64-winpty-inputs/p1-windows-arm64-winpty-source
      - uses: actions/download-artifact@v4
        with:
          name: p1-windows-arm64-console-source
          run-id: 42322393412
          github-token: ${{ github.token }}
          path: .build-cache/p1-arm64-console-inputs/source
      - uses: actions/download-artifact@v4
        with:
          name: p1-arm64-console-native-jvm-probe
          run-id: 42323927902
          github-token: ${{ github.token }}
          path: .build-cache/p1-arm64-console-inputs/probe
      - run: python scripts/test-p1-arm64-console-stage.py
      - run: python scripts/test-p1-arm64-winpty-stage.py
      - run: python scripts/test-p1-openbsd-jna-stage.py
      - run: python scripts/test-p1-sunos-jna-stage.py
      - run: python scripts/test-p1-arm64-component-stage.py
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '13575492220'
          run-id: '42375096503'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: .build-cache/p1-cyg-inputs/p1-cygwin-x64-launcher-source
      - name: Fetch exact reviewed SPARC and OpenBSD original archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/fetch-p1-sparc-artifact.py sparc
          python scripts/fetch-p1-sparc-artifact.py openbsd-i386
      - run: python scripts/test-p1-cyglaunch-stage.py
      - run: python scripts/test-p1-sparc-artifact-input.py
      - run: python scripts/test-p1-sparc-jna-stage.py
      - run: python scripts/test-p1-openbsd-i386-stage.py
      - name: Install browser dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 install -y dbus-x11 libsecret-1-0 gnome-keyring
          node frontend/node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - name: Install Windows browsers
        if: runner.os == 'Windows'
        run: node frontend/node_modules/playwright/cli.js install chromium firefox webkit
      - name: Prepare macOS browsers and isolated keychain
        if: runner.os == 'macOS'
        run: |
          node frontend/node_modules/playwright/cli.js install chromium firefox webkit
          python scripts/ci-keychain.py setup
      - name: Verify actual directory ABI from host compiler headers
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p .build-cache/directory-abi
          cc -Wall -Wextra -Werror docs/testing/tools/directory-abi-probe.c -o .build-cache/directory-abi/probe
          .build-cache/directory-abi/probe | tee .build-cache/directory-abi/result.json
      - name: Qualify source Java, exact install and full application matrix
        run: |
          set -euo pipefail
          failure_tail() {
            for logfile in .build-cache/source-qualification/*.log; do
              if [[ -f "$logfile" ]]; then tail -n 50 -- "$logfile"; fi
            done
          }
          trap failure_tail ERR
          if [[ "$RUNNER_OS" == Linux ]]; then
            dbus-run-session -- bash -eu -c '
              python -c "import secrets; print(secrets.token_hex(32))" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
              python scripts/ci-secret-service.py ready
              python scripts/source-native-qualification.py
            '
          else
            python scripts/source-native-qualification.py
          fi
      - name: Remove isolated macOS keychain
        if: always() && runner.os == 'macOS'
        run: python scripts/ci-keychain.py cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-native-unified-${{ matrix.os }}
          include-hidden-files: true
          retention-days: 90
          path: |
            source-client.log
            source-qualification-build.log
            .build-cache/source-qualification/
            .build-cache/directory-abi/
            .build-cache/M10.5.9/
            .build-cache/R4/
            .build-cache/M10.5.4-native-credentials.json
            .build-cache/M10.5.8-sdk-results.json
            .build-cache/M10.5.8-examples-results.json
            .build-cache/M10-launcher-results.json
            native-load-*.log
            harness-*/native-load-*.log
            harness-*/target/surefire-reports/
            harness-cli/target/harness-cli-0.1.0-SNAPSHOT.jar
            target/bom.json
            target/osv-results.json
            target/candidate-smoke.json
            target/jharness-0.1.0-SNAPSHOT-candidate.zip

  identical-runtime:
    needs: qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      JHARNESS_EXTENDED_SOURCE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: source-native-unified-windows-2022
          path: .build-cache/unified-check/windows-2022
      - uses: actions/download-artifact@v4
        with:
          name: source-native-unified-ubuntu-24.04
          path: .build-cache/unified-check/ubuntu-24.04
      - uses: actions/download-artifact@v4
        with:
          name: source-native-unified-macos-latest
          path: .build-cache/unified-check/macos-latest
      - uses: actions/download-artifact@v4
        with:
          name: source-native-unified-ubuntu-24.04-arm
          path: .build-cache/unified-check/ubuntu-24.04-arm
      - uses: actions/download-artifact@v4
        with:
          name: source-native-unified-macos-15-intel
          path: .build-cache/unified-check/macos-15-intel
      - name: Require identical qualified runtime bytes on all targets
        run: python scripts/check-unified-qualification.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-runtime-equality
          include-hidden-files: true
          path: .build-cache/unified-equality.json

name: Pinned native source build candidates
on:
  workflow_dispatch:
  push:
    branches: [codex/m1059-full-validation]
    paths: [.github/workflows/gap-native-source-build.yml]
permissions:
  contents: read
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select installed Windows GNU build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          'C:\msys64\mingw64\bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          'C:\msys64\usr\bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Verify source pin and failure ownership offline
        run: python docs/testing/tools/test-build-native-from-source.py
      - name: Build exact pinned native source candidates
        run: python docs/testing/tools/build-native-from-source.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-source-${{ matrix.os }}
          include-hidden-files: true
          retention-days: 90
          path: |
            .build-cache/native-source-build/report.json
            .build-cache/native-source-build/*.log
            .build-cache/native-source-build/*-build-source-diff.patch
            .build-cache/native-source-build/libffi-release-3.4.4.tar.gz
            .build-cache/native-source-build/jna/build/**/libjnidispatch.*
            .build-cache/native-source-build/jna/build/**/jnidispatch.dll
            .build-cache/native-source-build/pty4j/os/darwin/libpty.dylib
            .build-cache/native-source-build/pty4j/os/linux/x86-64/libpty.so

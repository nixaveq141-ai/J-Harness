name: Pinned Windows PTY source candidates
on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        default: all
        options: [all, console, winpty]
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: windows-2022
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(inputs.scope == 'console' && '["console"]' || inputs.scope == 'winpty' && '["winpty"]' || '["winpty","console"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        if: matrix.component == 'winpty'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'
      - uses: NuGet/setup-nuget@v2
      - name: Verify pinned upstream SDK prerequisite
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'C:\Program Files (x86)\Windows Kits\10\Include\10.0.22621.0\um\Windows.h')) {
            throw 'Pinned console source requires Windows SDK 10.0.22621.0'
          }
          MSBuild.exe -version
      - name: Verify source pin and failed-attempt controls offline
        run: |
          python docs/testing/tools/test-build-windows-pty-from-source.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python docs/testing/tools/test-patch-winpty-directory.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python docs/testing/tools/test-assemble-native-preview.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python docs/testing/tools/test-load-winpty-source-extension.py
      - name: Install signed MSYS build tools
        if: matrix.component == 'winpty'
        shell: pwsh
        run: |
          & 'C:\msys64\usr\bin\bash.exe' -lc 'pacman -S --noconfirm --needed make mingw-w64-x86_64-gcc'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'C:\msys64\usr\bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          'C:\msys64\mingw64\bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build fixed reviewed source only
        run: python docs/testing/tools/build-windows-pty-from-source.py --component ${{ matrix.component }}
      - uses: actions/download-artifact@v4
        if: matrix.component == 'winpty'
        with:
          name: native-source-windows-latest
          run-id: 40998915552
          github-token: ${{ github.token }}
          path: .build-cache/verified-source-jni
      - name: Build current trusted Java runtime for native ABI verification
        if: matrix.component == 'winpty'
        shell: bash
        run: sh ./mvnw -B -DskipTests package > winpty-probe-build.log 2>&1
      - name: Verify source CWD/process-list/resize/exit and missing-library rejection
        if: matrix.component == 'winpty'
        run: python docs/testing/tools/load-winpty-source-extension.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-pty-source-${{ matrix.component }}
          include-hidden-files: true
          retention-days: 90
          path: |
            .build-cache/windows-pty-source/report.json
            .build-cache/windows-pty-source/*.log
            .build-cache/windows-winpty-load/
            winpty-probe-build.log
            harness-cli/target/harness-cli-0.1.0-SNAPSHOT.jar
            .build-cache/windows-pty-source/winpty/build/winpty.dll
            .build-cache/windows-pty-source/winpty/build/winpty-agent.exe
            .build-cache/windows-pty-source/pty4j/native/helper-build/Release/win-helper.dll
            .build-cache/windows-pty-source/console/bin/**/OpenConsole.exe
            .build-cache/windows-pty-source/console/bin/**/conpty.dll

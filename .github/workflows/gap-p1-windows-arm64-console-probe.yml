name: P1 exact ARM64 Console native JVM component probe
on:
  workflow_dispatch:
  push:
    branches: [codex/m1059-full-validation]
    paths: [.github/workflows/gap-p1-windows-arm64-console-probe.yml]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: windows-11-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: arm64
      - name: Select native JDK21
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "$env:JAVA_HOME_21_AARCH64/bin/java.exe")) { throw 'Native JDK21 required' }
          "JAVA_HOME=$env:JAVA_HOME_21_AARCH64" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$env:JAVA_HOME_21_AARCH64/bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - uses: actions/download-artifact@v4
        with:
          name: p1-windows-arm64-console-source
          run-id: 42322393412
          github-token: ${{ github.token }}
          path: .build-cache/p1-console-input
      - uses: actions/download-artifact@v4
        with:
          name: p1-windows-arm64-jna-source
          run-id: 42159389661
          github-token: ${{ github.token }}
          path: .build-cache/p1-arm64-inputs/p1-windows-arm64-jna-source
      - uses: actions/download-artifact@v4
        with:
          name: p1-windows-arm64-helper-source
          run-id: 42158936851
          github-token: ${{ github.token }}
          path: .build-cache/p1-arm64-inputs/p1-windows-arm64-helper-source
      - run: python scripts/test-p1-arm64-console-probe.py
      - run: python scripts/probe-p1-windows-arm64-console.py
      - name: Show bounded component failure
        if: failure()
        run: python -c "from pathlib import Path; p=Path('.build-cache/p1-arm64-console-probe'); [(print(f.name),print(f.read_text(errors='replace')[-4096:])) for f in p.glob('*.log')]"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-arm64-console-native-jvm-probe
          include-hidden-files: true
          retention-days: 90
          path: |
            .build-cache/p1-arm64-console-probe/**
            .build-cache/p1-console-input/report.json
            .build-cache/p1-console-input/console/bin/**/OpenConsole.exe
            .build-cache/p1-console-input/console/bin/**/conpty.dll

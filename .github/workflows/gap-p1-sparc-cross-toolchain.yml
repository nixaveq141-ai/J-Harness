name: P1 Solaris SPARC cross toolchain
on:
  workflow_dispatch:
  push:
    branches: [codex/m1059-full-validation]
    paths: [.github/workflows/gap-p1-sparc-cross-toolchain.yml]
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test-p1-sparc-cross-toolchain.py
      - name: Install host compiler prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgmp-dev libmpfr-dev libmpc-dev flex bison texinfo
      - run: python scripts/build-p1-sparc-cross-toolchain.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-sparc-cross-toolchain
          include-hidden-files: true
          retention-days: 90
          path: |
            .build-cache/p1-sparc-cross-toolchain/*.json
            .build-cache/p1-sparc-cross-toolchain/*.log
            .build-cache/p1-sparc-cross-toolchain/toolchain.tgz
            .build-cache/p1-sparc-cross-toolchain/smoke.c
            .build-cache/p1-sparc-cross-toolchain/smoke-32
            .build-cache/p1-sparc-cross-toolchain/smoke-64

name: Source-built JNI and PTY load controls
on:
  workflow_dispatch:
  push:
    branches: [codex/m1059-full-validation]
    paths: [.github/workflows/gap-native-source-load.yml]
permissions:
  contents: read
  actions: read
jobs:
  load:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            source_run: '40995618881'
          - os: macos-latest
            source_run: '40998915552'
          - os: windows-latest
            source_run: '40998915552'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build current trusted probe runtime
        shell: bash
        run: sh ./mvnw -B -DskipTests package > native-probe-build.log 2>&1
      - name: Verify artifact identity and path rejection offline
        run: python docs/testing/tools/test-load-native-source-candidates.py
      - uses: actions/download-artifact@v4
        with:
          name: native-source-${{ matrix.os }}
          run-id: ${{ matrix.source_run }}
          github-token: ${{ github.token }}
          path: .build-cache/source-candidates
      - name: Verify source-built candidates and reject missing-library fallbacks
        run: python docs/testing/tools/load-native-source-candidates.py --source-run ${{ matrix.source_run }} --input .build-cache/source-candidates
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-source-load-${{ matrix.os }}
          include-hidden-files: true
          retention-days: 90
          path: |
            native-probe-build.log
            .build-cache/native-source-load/

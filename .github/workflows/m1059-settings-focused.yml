name: M10.5.9 browser focused diagnostics (not acceptance)
on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        description: Selected browser diagnostic scope
        default: turns
        options: [turns, extensions, models, development]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.scope == 'development' && '[{"os":"macos-latest","fixture":"development"}]' || inputs.scope == 'models' && '[{"os":"macos-latest","fixture":"models"}]' || inputs.scope == 'extensions' && '[{"os":"ubuntu-latest","fixture":"extensions"},{"os":"macos-latest","fixture":"extensions"}]' || '[{"os":"ubuntu-latest","fixture":"turns"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      JHARNESS_EVIDENCE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      JHARNESS_MATRIX_ENGINES: ${{ inputs.scope == 'extensions' && 'chromium' || 'webkit' }}
      JHARNESS_MATRIX_FIXTURES: ${{ matrix.fixture }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build current UI and diagnostic runtime
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          sh ./mvnw -B -DskipTests package > focused-build.log 2>&1 || { tail -n 80 focused-build.log; exit 1; }
      - name: Install selected browser
        working-directory: frontend
        run: node node_modules/playwright/cli.js install --with-deps ${{ env.JHARNESS_MATRIX_ENGINES }}
      - name: Verify original selected browser checks (stop at first failure)
        run: |
          set -euo pipefail
          rounds=3
          if [[ "${{ inputs.scope }}" != 'turns' ]]; then rounds=1; fi
          for round in $(seq 1 "$rounds"); do
            if node scripts/run-workbench-matrix.mjs; then fixture_exit=0; else fixture_exit=$?; fi
            snapshot=".build-cache/M10.5.9/focused-attempt-$round/.build-cache/M10.5.9"
            mkdir -p "$snapshot"
            cp -R .build-cache/M10.5.9/browser "$snapshot/browser"
            if [[ "$fixture_exit" != 0 ]]; then exit "$fixture_exit"; fi
          done
      - name: Preserve original diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1059-browser-focused-${{ matrix.os }}
          include-hidden-files: true
          path: |
            focused-build.log
            .build-cache/M10.5.9/browser/
            .build-cache/M10.5.9/focused-attempt-*/
            .build-cache/M10-settings-*.png
            .build-cache/M10.5.3-turns-*.png
            .build-cache/M10.5.3-turns-failure.txt
            .build-cache/M10.5.4-models-failure.txt
            .build-cache/M10.5.9-development-*.png
            .build-cache/M10.5.9-development-failure.txt
            .build-cache/M10.5.9-development-diagnostic-failure.txt

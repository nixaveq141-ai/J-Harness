name: M10.5.9 WebKit focused diagnostics (not acceptance)
on:
  push:
    branches: [codex/m1059-full-validation]
    paths:
      - frontend/tests/runtime.mjs
      - frontend/tests/turns.mjs
      - .github/workflows/m1059-settings-focused.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            fixture: turns
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      JHARNESS_EVIDENCE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      JHARNESS_MATRIX_ENGINES: webkit
      JHARNESS_MATRIX_FIXTURES: ${{ matrix.fixture }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build current UI and diagnostic runtime
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          sh ./mvnw -B -DskipTests package > focused-build.log 2>&1 || { tail -n 80 focused-build.log; exit 1; }
      - name: Install WebKit
        working-directory: frontend
        run: node node_modules/playwright/cli.js install --with-deps webkit
      - name: Verify original selected WebKit checks (stop at first failure)
        run: |
          set -euo pipefail
          for round in 1 2 3; do
            if node scripts/run-workbench-matrix.mjs; then fixture_exit=0; else fixture_exit=$?; fi
            snapshot=".build-cache/M10.5.9/focused-attempt-$round/.build-cache/M10.5.9"
            mkdir -p "$snapshot"
            cp -R .build-cache/M10.5.9/browser "$snapshot/browser"
            if [[ "$fixture_exit" != 0 ]]; then exit "$fixture_exit"; fi
          done
      - name: Preserve original diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1059-webkit-focused-${{ matrix.os }}
          include-hidden-files: true
          path: |
            focused-build.log
            .build-cache/M10.5.9/browser/
            .build-cache/M10.5.9/focused-attempt-*/
            .build-cache/M10-settings-*.png
            .build-cache/M10.5.3-turns-*.png
            .build-cache/M10.5.3-turns-failure.txt

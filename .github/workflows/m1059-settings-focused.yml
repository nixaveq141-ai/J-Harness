name: M10.5.9 WebKit focused diagnostics (not acceptance)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            fixture: settings
          - os: ubuntu-latest
            fixture: turns
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      JHARNESS_EVIDENCE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      JHARNESS_MATRIX_ENGINES: webkit
      JHARNESS_MATRIX_FIXTURES: ${{ matrix.fixture }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build current UI and diagnostic runtime
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          sh ./mvnw -B -DskipTests package > focused-build.log 2>&1 || { tail -n 80 focused-build.log; exit 1; }
      - name: Install WebKit
        working-directory: frontend
        run: node node_modules/playwright/cli.js install --with-deps webkit
      - name: Prepare isolated test keychain
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/jharness-m1059-settings.keychain-db"
          password="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security default-keychain -d user -s "$keychain"
          security list-keychains -d user -s "$keychain"
      - name: Verify original selected WebKit checks
        run: node scripts/run-workbench-matrix.mjs
      - name: Delete isolated test keychain
        if: always() && runner.os == 'macOS'
        run: |
          keychain="$RUNNER_TEMP/jharness-m1059-settings.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi
      - name: Preserve original diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1059-webkit-focused-${{ matrix.os }}
          include-hidden-files: true
          path: |
            focused-build.log
            .build-cache/M10.5.9/browser/
            .build-cache/M10-settings-*.png
            .build-cache/M10.5.3-turns-*.png
            .build-cache/M10.5.3-turns-failure.txt

name: P1 signed OpenBSD i386 netboot and native JNA components
on:
  workflow_dispatch:
  push:
    branches: [codex/m1059-full-validation]
    paths: [.github/workflows/gap-p1-openbsd-i386-jna.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test-evidence-io.py
      - run: python scripts/test-evidence-run.py
      - run: python scripts/test-p1-openbsd-i386-bootstrap.py
      - run: python scripts/test-p1-openbsd-jna.py
      - name: Install native VM and signature verification tools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils signify-openbsd
      - name: Grant this runner access to KVM when available
        run: |
          if test -c /dev/kvm; then
            sudo usermod -aG kvm "$(id -un)"
            ls -l /dev/kvm
          else
            echo 'KVM unavailable; the owned VM will use TCG'
          fi
      - name: Run owned native i386 VM
        run: |
          if test -c /dev/kvm; then
            sg kvm -c 'python scripts/bootstrap-p1-openbsd-i386.py'
          else
            python scripts/bootstrap-p1-openbsd-i386.py
          fi
      - name: Show bounded VM evidence on failure
        if: failure()
        run: python -c "from pathlib import Path; p=Path('.build-cache/p1-openbsd32-vm'); [(print(f.name),print(f.read_text(errors='replace')[-4096:])) for f in [p/'install-serial.log',p/'boot-serial.log',p/'http.log',p/'source-component.log'] if f.is_file()]"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-openbsd-i386-native-jna-source
          include-hidden-files: true
          retention-days: 90
          path: |
            .build-cache/p1-openbsd32-vm/*.json
            .build-cache/p1-openbsd32-vm/*.log
            .build-cache/p1-openbsd32-vm/component.tgz
            .build-cache/p1-openbsd32-vm/openbsd-79-base.pub
            .build-cache/p1-openbsd32-vm/web/7.9/i386/SHA256*
